name: Test, build, publish, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: acrtestathonun001
  IMAGE_NAME: enginex
  RESOURCE_GROUP: rg-test-Athon-test-un-001
  CONTAINER_APP_NAME: ca-test-athon-test-un-001

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Sign in to Azure with OIDC
        if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push image to Azure Container Registry
        if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          az acr login --name "$ACR_NAME"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$login_server/$IMAGE_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$login_server/$IMAGE_NAME:latest"
          docker push "$login_server/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$login_server/$IMAGE_NAME:latest"

  deploy:
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade
      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          image="$login_server/$IMAGE_NAME:$GITHUB_SHA"
          az acr login --name "$ACR_NAME"
          docker pull "$image"

          db_password=$(az containerapp secret show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --secret-name postgres-password \
            --query value \
            --output tsv)
          echo "::add-mask::$db_password"

          docker run --rm \
            --env POSTGRES_HOST=psql-test-athon-test-un-001.postgres.database.azure.com \
            --env POSTGRES_PORT=5432 \
            --env POSTGRES_DB=enginex \
            --env POSTGRES_USER=psqladmin \
            --env POSTGRES_PASSWORD="$db_password" \
            --env POSTGRES_SSLMODE=require \
            "$image" \
            python /app/scripts/setup_database.py
          unset db_password
      - name: Deploy immutable image to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          image="$login_server/$IMAGE_NAME:$GITHUB_SHA"
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$image" \
            --output none
      - name: Verify the new revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            latest=$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --query properties.latestRevisionName \
              --output tsv)
            ready=$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --query properties.latestReadyRevisionName \
              --output tsv)
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              echo "Revision $latest is ready."
              exit 0
            fi
            sleep 10
          done
          echo "The new Container Apps revision did not become ready within five minutes."
          exit 1
